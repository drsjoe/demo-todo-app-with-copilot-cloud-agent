<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<title>Login</title>
</head>
<body>
	<h1>Sign in</h1>

	<p th:if="${loginError}">Invalid email address or password.</p>
	<p th:if="${logoutSuccess}">You have been signed out successfully.</p>

	<form th:action="@{/login}" method="post">
		<div>
			<label for="email">Email address</label>
			<input type="email" id="email" name="email" />
		</div>
		<div>
			<label for="password">Password</label>
			<input type="password" id="password" name="password" />
		</div>
		<button type="submit">Sign in</button>
	</form>

	<p><a th:href="@{/register}">Need an account? Register</a></p>
</body>
</html>
