<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<title>Register</title>
</head>
<body>
	<h1>Create an account</h1>

	<form th:action="@{/register}" th:object="${registrationRequest}" method="post">
		<div>
			<label for="firstName">First name</label>
			<input type="text" id="firstName" th:field="*{firstName}" />
			<span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}">First name error</span>
		</div>
		<div>
			<label for="lastName">Last name</label>
			<input type="text" id="lastName" th:field="*{lastName}" />
			<span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}">Last name error</span>
		</div>
		<div>
			<label for="email">Email address</label>
			<input type="email" id="email" th:field="*{email}" />
			<span th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</span>
		</div>
		<div>
			<label for="password">Password</label>
			<input type="password" id="password" th:field="*{password}" />
			<span th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password error</span>
		</div>
		<div>
			<label for="confirmPassword">Confirm password</label>
			<input type="password" id="confirmPassword" th:field="*{confirmPassword}" />
			<span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">Password confirmation error</span>
		</div>
		<span th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}">Global error</span>
		<button type="submit">Register</button>
	</form>

	<p><a th:href="@{/login}">Already have an account? Sign in</a></p>
</body>
</html>
